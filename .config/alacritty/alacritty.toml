[general]
live_config_reload = true

[[keyboard.bindings]]
key = "C"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

[[keyboard.bindings]]
key = "X"
mods = "Control"
command = { program = "sh", args = ["-c", "alacritty --hold -e sh -c 'xclip -o | xclip -selection clipboard && xclip -selection clipboard -o | sed -e s/.// > /dev/null'"] }

[colors.primary]
background = "#24283b"
foreground = "#c0caf5"

[colors.normal]
black   = "#1d202f"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[colors.selection]
background = "#364a82"
foreground = "#c0caf5"

[colors.cursor]
text = "#ff0000"
cursor = "#e0af68"

[cursor]
style = "Block"
unfocused_hollow = true

[font]
normal = { family = "monospace", style = "Regular" }
size = 12.0
