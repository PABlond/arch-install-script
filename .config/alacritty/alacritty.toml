[general]
live_config_reload = true

[[keyboard.bindings]]
key = "C"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

[[keyboard.bindings]]
key = "X"
mods = "Control"
command = { program = "sh", args = ["-c", "alacritty --hold -e sh -c 'xclip -o | xclip -selection clipboard && xclip -selection clipboard -o | sed -e s/.// > /dev/null'"] }

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[colors.selection]
background = "#585b70"
foreground = "#cdd6f4"

[font]
normal = { family = "monospace", style = "Regular" }
size = 12.0
